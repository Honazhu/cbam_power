# PR1 frozen contract. No private data or personal absolute paths.
"registry_version" = "PR1_BASELINES_1"
"scope" = "Immutable authorized local PR1 baseline registry, not a public data bundle or full replication PASS"
"input_root_env" = "CBAM_INPUT_ROOT"
"baseline_subdirectory" = "baselines"
"output_root_env" = "CBAM_OUTPUT_ROOT"
"default_output_location" = "sibling runs directory of CBAM_INPUT_ROOT; outside input root and candidate tree"
"expected_update_policy" = "No update mode; intentional scientific changes require separate review, never generated from new estimates"
"public_rights" = "UNVERIFIED; candidate source/config only, all baseline payloads PRIVATE_ONLY"
"schema_policy" = "CSV headers/row counts and keys checked; JSON top-level structure checked; NPZ NPY headers/payload dimensions and all references checked; Parquet bytes/hash bound to registration-time inspected schema"
"covariance_identity" = ["legacy_file_path", "covariance_key", "ordered_parameter_columns"]
"numerical_reestimation_this_phase" = false

[validation]

[validation.file_integrity]
"comparison" = "SHA256 exact"
"reserialized_output_bytes" = "not required to equal legacy bytes"
"update_expected_from_new_run" = false


[validation.sample_identity]
"comparison" = "exact UTC timestamps and model/sample keys before numerical comparison"
"fields" = ["model_id", "sorted_timestamp_utc_ns", "N", "pre_N", "post_N", "year_N", "start", "end", "missing_mask", "kernel_weights", "FE_reference", "design_columns"]
"legacy_unit" = "us"
"canonical_unit" = "ns"
"integer_encoding" = "signed int64 little endian ordered UTC epoch values"
"translation_rule" = "Both hashes must be independently reproduced from actual timestamps, whose sorted values and missing sets are equal. Hash strings alone cannot establish encoding equivalence."
"actual_timestamp_proof_required" = true
"missing_proof_status" = "UNVERIFIED_SAMPLE_IDENTITY"
"future_membership_reconstruction" = "PR5; PR1 pins panel, synthetic data, catalogs and membership evidence without estimating"


[validation.full_frozen]
"atol" = 1e-06
"rtol" = 1e-08
"equal_nan" = true
"nan_mask_must_match" = true
"applies_to" = ["V2F all coefficients/covariances", "V3 all coefficients/covariances", "V3.2 P2/P3 all beta/covariance"]
"source" = "v3_formal_cbam/src/validation.py::validate_full_frozen_outputs"
"extension_status" = "V3 and P2/P3 upper bounds adopted and frozen by PR1 per plan Section 3.2; not a claim of executed replication"


[validation.primary_internal]
"atol" = 1e-10
"rtol" = 0.0
"source" = "v3_formal_cbam/src/validation.py::validate_results"


[validation.core_panel]
"atol" = 1e-08
"rtol" = 1e-11
"nan_mask_must_match" = true
"source" = "v3_formal_cbam/src/data_processing.py::reconstruct_core"


[validation.weather]
"strict_abs_less_than" = 1e-09
"nan_mask_must_match" = true
"source" = "v3_formal_cbam/src/reused/weather_audit.py"


[validation.frozen_weights_csv_json]
"atol" = 1e-15
"rtol" = 0.0
"source" = "v3_formal_cbam/v3_1_final_patch/src/synthetic_method_summary.py"


[validation.polynomial_p1_parent_tau_se]
"atol" = 1e-08
"rtol" = 1e-10
"source" = "v3_formal_cbam/v3_2_polynomial_rdit/src/estimate.py::baseline_check"


[validation.polynomial_p1_all_coefficients]
"strict_abs_less_than" = 1e-07
"transformation" = "z^k coefficient / h^k to r^k; covariance transformed by the same diagonal linear map"
"source" = "v3_formal_cbam/v3_2_polynomial_rdit/src/estimate.py::baseline_check"


[validation.model_status]
"comparison" = "exact ID/status/reason/flags, including not estimated records"
"do_not_replace" = ["BLOCKED", "NOT_RUN", "UNSUPPORTED", "INSUFFICIENT_PRE_SUPPORT"]
"skip_missing_baseline" = false


[validation.reporting]
"rule" = "trace displayed numbers, curves and bins to formal model IDs, coefficients/covariances and authorized source data; rounding at display only"
"presentation_reestimation_allowed" = false
"image_pixel_identity_required" = false
"rounded_headline_tolerance_is_not_full_equivalence" = true



