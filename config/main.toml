[rdit]
"terms" = ["const", "post", "r", "post_r"]
"main_bandwidth_days" = 90
"bandwidth_days" = [14, 30, 60, 90, 180]
"donut_days" = [0, 3]
"window_predicate" = "abs(r) < bandwidth and abs(r) >= donut"
"kernel" = "triangular"
"kernel_formula" = "1 - abs(r) / bandwidth"
"fixed_effects" = ["hour", "weekday"]
"basic_fixed_effects" = []
"basic_bandwidth_days" = 90
"basic_hac_hours" = [168, 24]
"outcomes" = ["scheduled_export_proxy", "commercial_net_MW"]
"placebo_years" = [2024, 2025]
"local_spread_terms" = ["post", "r", "post_r", "spread_c", "post_s"]

[rdit.local_spread_contrast]
"spread_c" = 1
"post_s" = 1



[inference]
"hac_elapsed_hours" = [168, 24]
"kernel" = "Bartlett"
"hac_kernel" = "1 - abs(lag) / (L + 1)"
"covariance_grid" = "real elapsed UTC hours; missing slots contain zero scores, not zero outcomes"
"influence" = "(X * (w * residual)) @ bread * sqrt(n/(n-k))"
"bread" = "inverse weighted XTX via inverse QR triangular factor"
"solver" = "scipy.linalg.lstsq lapack_driver=gelsd"
"fe_reference" = "sorted lowest observed level, drop first"
"minimum_sample" = 100
"minimum_pre_or_post" = 24
"full_rank_required" = true
"joint_cross_covariance_required" = true
"confidence_multiplier" = 1.96
"p_value" = "two-sided standard normal survival function"
"negative_contrast_variance_error_below" = -1e-07


