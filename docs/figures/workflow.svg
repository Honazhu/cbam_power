<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Research design: actual flows, a synthetic benchmark and bilateral weather</title>
  <desc id="desc">Original redraw of the existing project presentation's three research branches. Left: Energy-Charts commercial net-flow mirrors with ENTSO-E provenance are harmonized into positive hourly net exports, then analyzed using Basic and calendar-fixed-effect local RDiT. Centre: Montenegro is matched to Greece and Austria, historical 2024 weights are evaluated in 2025, and a separately frozen final benchmark defines an actual-minus-synthetic gap in MW. Right: ERA5 grid variables are area weighted using frozen geographic intersections, aligned to hourly delivery times, and used as bilateral weather controls in RDiT. No empirical result or donor weight is shown.</desc>
