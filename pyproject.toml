# CloudDocs can mark editable .pth files hidden; use the regular wheel:
# uv sync --locked --no-editable --extra weather --group test
# uv run --locked --no-editable --extra weather --group test ...
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "cbam-power"
version = "0.1.0rc1"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Hona Zhu"}]
description = "Offline portable CBAM electricity research package with frozen scientific contracts"
requires-python = ">=3.12,<3.13"
# Numerical versions match the frozen V3 environment. No download client or
# reporting stack is required by the offline PR3 computation.
dependencies = [
  "numpy==2.5.3",
  "pandas==3.0.5",
  "scipy==1.18.1",
  "pyarrow==25.0.1",
  "lxml==6.1.3",
  "openpyxl==3.1.5",
  "statsmodels==0.15.0",  # independent QA oracle retained from frozen weather model code
]

[project.scripts]
cbam-power = "cbam_power.cli:main"

[project.optional-dependencies]
weather = [
  "xarray==2026.7.0",
  "netCDF4==1.7.4",
  "h5netcdf==1.8.1",
  "h5py>=3.11,<4",  # h5netcdf backend; absent from the historical version snapshot
  "shapely==2.1.2",
  "pyproj==3.8.0",
]

# Teaching-only dependencies; the frozen numerical/weather stack is unchanged.
learning = [
  "matplotlib==3.11.1",
  "nbformat==5.11.1",
  "nbclient==0.11.0",
  "ipykernel==7.3.0",
  "PyYAML==6.0.3",
  "markdown-it-py==4.2.0",
  "latex2mathml==3.81.1",
]

[dependency-groups]
test = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/cbam_power"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]
markers = [
  "public: artificial data only; no authorized input required",
  "authorized: requires the exact external authorized input closure",
  "frozen: numerical comparison against immutable private weather references",
]

# Wheel contains only reviewed code and static contracts; never I/B/A payloads.
[tool.hatch.build.targets.wheel.force-include]
"config" = "cbam_power/_resources/config"
"manifests" = "cbam_power/_resources/manifests"
"uv.lock" = "cbam_power/_resources/uv.lock"
"pyproject.toml" = "cbam_power/_resources/pyproject.toml"
".python-version" = "cbam_power/_resources/.python-version"
